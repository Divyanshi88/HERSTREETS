<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="referrer" content="strict-origin-when-cross-origin" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <meta
            name="description"
            content="Compare walking routes with practical, time-aware community context using HerStreet."
        />
        <meta
            name="keywords"
            content="HerStreet, walking routes, community observations, accessibility, OpenStreetMap"
        />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="HerStreet" />
        <meta property="og:title" content="HerStreet | A more thoughtful way home" />
        <meta
            property="og:description"
            content="Know how a place feels before you get there with practical walking-route context."
        />
        <meta property="og:url" content="https://github.com/Divyanshi88/HERSTREETS" />
        <meta name="twitter:card" content="summary" />
        <link rel="manifest" href="./manifest.json" />
        <!-- config.js is not included in bundle.js -->
        <script src="config.js"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <title>HerStreet | A more thoughtful way home</title>
        <style>
            html,
            body {
                overscroll-behavior: none;
                height: 100%;
                width: 100%;
                margin: 0;
                padding: 0;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            html {
                min-height: 100%;
            }

            body {
                min-height: 100%;
                overflow-x: hidden;
            }

            #root {
                min-height: 100%;
                width: 100%;
            }

            ul {
                list-style-type: none;
                margin: 0;
                padding: 0;
            }

            svg {
                display: block;
                color: inherit;
            }
        </style>
    </head>
    <body></body>
</html>
